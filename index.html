<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Messages</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="messages-app">
      <aside class="sidebar" aria-label="Conversations">
        <header class="sidebar-header">
          <div class="window-dots" aria-hidden="true">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
          </div>
          <h1>Messages</h1>
        </header>

        <div class="search">
          <input type="search" id="search" placeholder="Search" aria-label="Search" />
        </div>

        <ul id="threadList" class="thread-list" role="list"></ul>
      </aside>

      <main class="chat" aria-live="polite">
        <header class="chat-header">
          <div class="contact">
            <div id="contactAvatar" class="avatar" aria-hidden="true">G</div>
            <div>
              <p id="contactName" class="contact-name">Gemini</p>
              <p id="contactStatus" class="contact-status">Online • Ready for ADK</p>
            </div>
          </div>
          <div class="header-actions">
            <button class="ghost" type="button">Details</button>
          </div>
        </header>

        <div class="chat-body">
          <div class="paper"></div>
          <div id="messageList" class="message-list"></div>
          <div id="typingIndicator" class="typing" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
        </div>

        <form id="composerForm" class="composer" autocomplete="off">
          <div class="composer-inner">
            <button class="icon" type="button" aria-label="Camera" title="Camera">📷</button>
            <textarea
              id="composerInput"
              placeholder="iMessage"
              rows="1"
              spellcheck="true"
              aria-label="Message input"
            ></textarea>
            <button class="icon" type="button" aria-label="App drawer" title="App drawer">⬜️</button>
            <button class="send" type="submit">Send</button>
          </div>
          <p class="hint">Built to mirror iMessage. Wire up the Gemini ADK backend whenever you're ready.</p>
        </form>
      </main>
    </div>

    <script src="app.js" type="module"></script>
  </body>
</html>
